name: Publicar Version Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Permisos para Maven Wrapper
        run: chmod +x mvnw

      # OPCIÓN 1: Actualiza la versión del pom.xml quitando la "v" del tag (v1.0.2 -> 1.0.2)
      - name: Actualizar versión en pom.xml
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ./mvnw versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      # Compila con la versión ya actualizada
      - name: Compilar y generar paquete (.jar)
        run: ./mvnw clean package -DskipTests

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}