name: Publicar Version Release

on:
  push:
    tags:
      - 'v*.*.*'  # Se activa automáticamente al hacer push de tags como v1.0.0, v1.1.0, etc.

permissions:
  contents: write  # Otorga permisos para subir artefactos y crear la Release en GitHub

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Obtener el código fuente del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # Step 2: Configurar el entorno de Java 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Otorgar permisos de ejecución al ejecutable de Maven
      - name: Permisos para Maven Wrapper
        run: chmod +x mvnw

      # Step 4: Compilar el proyecto y empaquetar el archivo .jar
      - name: Compilar y generar paquete (.jar)
        run: ./mvnw clean package -DskipTests

      # Step 5: Crear la Release formal en GitHub y adjuntar el archivo .jar
      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}