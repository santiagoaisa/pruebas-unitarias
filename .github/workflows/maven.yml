name: MAVEN

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Requerido por SonarQube para analizar el historial de commits

      # Step 2: Configurar el entorno de Java 17
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Dar permisos al Maven Wrapper
      - name: Permisos de ejecución
        run: chmod +x mvnw

      # STEP 1 SOLICITADO: Compilación y Pruebas Unitarias
      - name: Step 1 - Compilar y ejecutar pruebas unitarias
        run: ./mvnw clean test

      # STEP 2 SOLICITADO: Análisis de Calidad con SonarQube
      - name: Step 2 - Ejecutar análisis en SonarQube
        env:
          SONAR_TOKEN: sqa_aa92d8dbac770faad637da5ecb191157318fe6ab
          SONAR_HOST_URL: http://190.233.44.248:9000
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=pruebas-unitarias \
            -Dsonar.projectName=pruebas-unitarias \
            -Dsonar.branch.name=${{ github.ref_name }}